<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exposure Solutions – Logo Intro</title>
<!-- 3-second animated Exposure Solutions sting. Rendered and placed in front of the screen ad and promo. -->
<style>
@font-face{font-family:Cinzel;src:url(../assets/fonts/Cinzel-normal.woff2) format("woff2");font-weight:400 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.stage{position:absolute;inset:0;display:grid;place-items:center}
.glow{position:absolute;width:90vmin;height:50vmin;background:radial-gradient(closest-side,#18c8dc66,transparent);filter:blur(4vmin);animation:pulse 3s ease-in-out forwards;opacity:0}
.logo{position:relative;width:min(82vw,130vmin);overflow:hidden}
.logo img{width:100%;display:block;mix-blend-mode:screen;animation:in 1.5s cubic-bezier(.2,.7,.2,1) forwards;opacity:0}
.sweep{position:absolute;inset:0;-webkit-mask:url(../assets/exposure-logo.png) center/100% 100% no-repeat;mask:url(../assets/exposure-logo.png) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 38%,#ffffff70 50%,transparent 62%);transform:translateX(-130%);animation:sweep 1.1s ease .9s forwards;mix-blend-mode:screen}
.presents{position:absolute;bottom:13vh;left:0;right:0;text-align:center;font-family:Cinzel,serif;letter-spacing:.6em;font-size:3vmin;color:#8ff0fa;opacity:0;animation:fade .7s ease 1.5s forwards}
.out{position:absolute;inset:0;background:#000;opacity:0;animation:fade .45s ease 2.55s forwards}
@keyframes in{0%{opacity:0;transform:scale(1.3);filter:blur(2vmin) brightness(2.2)}55%{opacity:1;filter:blur(0) brightness(1.4)}100%{opacity:1;transform:scale(1);filter:none}}
@keyframes sweep{to{transform:translateX(130%)}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}100%{opacity:.7;transform:scale(1)}}
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="logo"><img src="../assets/exposure-logo.png" alt="Exposure Solutions"><div class="sweep"></div></div>
</div>
<div class="presents">PRESENTS</div>
<div class="out"></div>
</body>
</html>
