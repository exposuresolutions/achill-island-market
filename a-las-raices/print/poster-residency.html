<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Las Raices – Weekly Residency Poster</title>
<link rel="stylesheet" href="print.css">
<style>
@page{size:A4;margin:0}
.sheet{width:210mm;height:297mm;background:var(--bg);color:var(--cream);padding:18mm 16mm 14mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.sheet::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 62%,#c27a2c38,transparent 70%);pointer-events:none}
.every{font-family:var(--display);font-size:20pt;letter-spacing:.5em;color:var(--ember);margin-left:.5em}
.day{font-family:var(--display);font-size:70pt;line-height:.95;letter-spacing:.04em;margin-top:2mm}
.time{font-family:var(--display);font-size:24pt;letter-spacing:.14em;margin-top:4mm}
.logo{width:118mm;margin:7mm 0 2mm}
.genre{font-style:italic;font-size:22pt;color:#cfc6ae}
.at{margin-top:6mm;font-family:var(--display);font-size:11pt;letter-spacing:.4em;color:var(--ember)}
.venue{font-family:var(--display);font-size:30pt;letter-spacing:.06em;margin-top:2mm;line-height:1.1}
.place{font-style:italic;font-size:20pt;color:#cfc6ae}
.note{margin-top:6mm;font-family:var(--display);font-size:12pt;letter-spacing:.14em;border:.4mm solid var(--ember);padding:2.5mm 6mm}
.foot{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 30mm;gap:8mm;align-items:center;text-align:left;padding-top:6mm;border-top:.6mm solid var(--ember)}
.foot h2{font-family:var(--display);font-weight:400;font-size:15pt;letter-spacing:.06em}
.foot p{font-size:12.5pt;color:#cfc6ae;line-height:1.35}
.qr{background:var(--cream);padding:2mm;border-radius:1.5mm}
.qr small{display:block;text-align:center;color:var(--ink);font:600 6pt/1.2 var(--display);letter-spacing:.1em;margin-top:1mm}
</style>
</head>
<body>
<div class="sheet">
  <div class="every" data-edit>EVERY</div>
  <div class="day" id="day" data-edit></div>
  <div class="time" id="time" data-edit></div>
  <img class="logo" src="../assets/logo-transparent.png" alt="A Las Raices">
  <div class="genre" data-edit>Live Rumba Flamenca · the Gipsy Fiesta</div>
  <div class="at" data-edit>LIVE AT</div>
  <div class="venue" id="venue" data-edit></div>
  <div class="place" id="place" data-edit></div>
  <div class="note" id="note" data-edit></div>
  <div class="foot">
    <div>
      <h2 data-edit>LOVE THE FIESTA? BOOK US PRIVATELY</h2>
      <p data-edit>Private gigs · parties at our partner venues · weddings</p>
      <p id="contact" data-edit></p>
    </div>
    <div class="qr"><img src="../assets/qr-facebook.svg" alt="QR code"><small>FOLLOW US</small></div>
  </div>
</div>

<script src="../data/band.js"></script>
<script src="common.js"></script>
<script>
var r = ALR.residency, c = contactBits();
document.getElementById("day").textContent = r.day.replace(/^every\s+/i, "").toUpperCase();
document.getElementById("time").textContent = r.time.toUpperCase();
document.getElementById("venue").textContent = r.venue.toUpperCase();
document.getElementById("place").textContent = r.place;
document.getElementById("note").textContent = r.note.toUpperCase();
document.getElementById("contact").innerHTML = "Bookings: " + c.agency + " · " + c.phone + " · " + c.email;
toolbar(); makeEditable(); markSample();
</script>
</body>
</html>
