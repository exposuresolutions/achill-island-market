<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Las Raices – Next Dates Poster</title>
<link rel="stylesheet" href="print.css">
<style>
@page{size:A4;margin:0}
.sheet{width:210mm;height:297mm;background:var(--bg);color:var(--cream);padding:16mm 16mm 14mm;display:flex;flex-direction:column}
.sheet::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 30%,#c27a2c2e,transparent 70%);pointer-events:none}
.logo{width:92mm;margin:0 auto}
.kicker{font-family:var(--display);letter-spacing:.42em;color:var(--ember);text-align:center;font-size:11pt;margin-top:4mm}
h1{font-family:var(--display);font-weight:400;text-align:center;font-size:36pt;letter-spacing:.08em;line-height:1.05;margin-top:5mm}
.sub{text-align:center;font-style:italic;font-size:17pt;color:#cfc6ae;margin-top:2mm}
.dates{list-style:none;margin:8mm 0 0;border-top:.4mm solid #ffffff22;flex:1}
.dates li{display:grid;grid-template-columns:34mm 1fr auto;align-items:center;gap:6mm;padding:3.6mm 2mm;border-bottom:.4mm solid #ffffff22}
.dates .d{font-family:var(--display);line-height:1.05}
.dates .d b{font-size:22pt;font-weight:400}
.dates .d span{display:block;font-size:9pt;letter-spacing:.2em;color:var(--ember)}
.dates .v{font-family:var(--display);font-size:14pt;letter-spacing:.04em}
.dates .t{font-style:italic;font-size:13pt;color:#cfc6ae}
.dates .tm{font-family:var(--display);font-size:14pt;letter-spacing:.06em;text-align:right}
.foot{display:grid;grid-template-columns:1fr 34mm;gap:8mm;align-items:center;margin-top:7mm;padding-top:6mm;border-top:.6mm solid var(--ember)}
.foot h2{font-family:var(--display);font-weight:400;font-size:17pt;letter-spacing:.06em}
.foot p{font-size:13pt;color:#cfc6ae;line-height:1.35}
.qr{background:var(--cream);padding:2mm;border-radius:1.5mm}
.qr small{display:block;text-align:center;color:var(--ink);font:600 6.5pt/1.2 var(--display);letter-spacing:.12em;margin-top:1mm}
</style>
</head>
<body>
<div class="sheet">
  <img class="logo" src="../assets/logo-transparent.png" alt="A Las Raices">
  <p class="kicker" data-edit>LIVE RUMBA FLAMENCA</p>
  <h1 id="title" data-edit>NEXT DATES</h1>
  <p class="sub" id="sub" data-edit>The Gipsy Fiesta is coming to a bar near you</p>
  <ul class="dates" id="dates"></ul>
  <div class="foot">
    <div>
      <h2 data-edit>BOOK US FOR YOUR PARTY</h2>
      <p data-edit>Weddings · birthdays · villa &amp; yacht parties · venues<br>Duo · Trio · Full 9-piece band</p>
      <p id="contact" data-edit style="margin-top:2mm"></p>
    </div>
    <div class="qr"><img src="../assets/qr-facebook.svg" alt="QR code"><small>SCAN FOR DATES</small></div>
  </div>
</div>

<script src="../data/band.js"></script>
<script src="common.js"></script>
<script>
var D = ALR, venues = [];
D.upcoming().forEach(function (g) { if (venues.indexOf(g.venue) < 0) venues.push(g.venue); });
toolbar('<label>Show: <select id="venue"><option value="">All upcoming dates</option>' +
  venues.map(function (v) { return '<option>' + v + '</option>'; }).join('') + '</select></label>' +
  '<label>Rows: <input id="rows" type="number" min="1" max="10" value="7" style="width:60px"></label>');

function render() {
  var v = document.getElementById("venue").value, n = +document.getElementById("rows").value || 7;
  var gigs = D.upcoming().filter(function (g) { return !v || g.venue === v; }).slice(0, n);
  document.getElementById("title").textContent = v ? "LIVE HERE" : "NEXT DATES";
  document.getElementById("sub").textContent = v ? "at " + v + " — come and join the fiesta" : "The Gipsy Fiesta is coming to a bar near you";
  document.getElementById("dates").innerHTML = gigs.map(function (g) {
    var d = new Date(g.date + "T12:00:00");
    return '<li><div class="d" data-edit><span>' + d.toLocaleDateString("en-GB", { weekday: "long" }).toUpperCase() + '</span><b>' +
      d.getDate() + ' ' + d.toLocaleDateString("en-GB", { month: "short" }).toUpperCase() + '</b></div>' +
      '<div data-edit><div class="v">' + (g.title || g.venue) + '</div><div class="t">' + (g.title ? g.venue + ", " : "") + g.town + ' · ' + g.lineup + '</div></div>' +
      '<div class="tm" data-edit>' + g.time.toUpperCase() + '</div></li>';
  }).join("") || '<li><div></div><div class="v" data-edit>New dates coming soon</div></li>';
  makeEditable();
}
var c = contactBits();
document.getElementById("contact").innerHTML = c.phone + " · " + c.email;
document.getElementById("venue").onchange = render;
document.getElementById("rows").oninput = render;
render(); markSample();
</script>
</body>
</html>
